<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Alder: an interactive 3D condo sales demo by Rohan Kakkar. Click floors and suites for floor plans, filter homes, switch day, sunset and night, and visit the rooftop pool.">
<link rel="canonical" href="https://rohankakkar.com/alder/">
<meta property="og:title" content="The Alder Residences · 3D demo by Rohan Kakkar">
<meta property="og:description" content="Interactive 3D condo sales experience built with Three.js.">
<meta property="og:image" content="https://rohankakkar.com/alder/cover.jpg">
<meta property="og:url" content="https://rohankakkar.com/alder/">
<meta name="twitter:card" content="summary_large_image">
<title>The Alder Residences · 3D demo by Rohan Kakkar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D tower; floor stack left, finder bottom-left, sales sheet slides in from the right (bottom sheet on phones). */
:root{
  --paper:#eef0ec; --panel:#fbfbf9; --ink:#15191a; --muted:#5b6461; --line:#d6dad4; --soft:#e7eae5;
  --accent:#1d5c57; --accent-ink:#ffffff; --accent-soft:#d7e8e4;
  --avail:#2c7a4b; --reserved:#a8701a; --sold:#858b88;
  --plan-bg:#fbfbf9; --plan-ink:#1b1f20; --plan-soft:#9ea6a1; --plan-corr:#eceee9;
  --shadow:0 18px 50px rgba(18,24,24,.18), 0 2px 8px rgba(18,24,24,.08);
  --f-display:'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --f-body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0f1312; --panel:#161b1a; --ink:#e8ece9; --muted:#9aa5a0; --line:#2a3231; --soft:#1e2524;
  --accent:#74bdb2; --accent-ink:#0d1716; --accent-soft:#1f3532;
  --avail:#5bb282; --reserved:#d9a346; --sold:#6f7673;
  --plan-bg:#161b1a; --plan-ink:#e2e7e3; --plan-soft:#5f6965; --plan-corr:#1d2322;
  --shadow:0 18px 50px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1312; --panel:#161b1a; --ink:#e8ece9; --muted:#9aa5a0; --line:#2a3231; --soft:#1e2524;
  --accent:#74bdb2; --accent-ink:#0d1716; --accent-soft:#1f3532;
  --avail:#5bb282; --reserved:#d9a346; --sold:#6f7673;
  --plan-bg:#161b1a; --plan-ink:#e2e7e3; --plan-soft:#5f6965; --plan-corr:#1d2322;
  --shadow:0 18px 50px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  color-scheme:dark }

html,body{height:100%}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#scene.pointing{cursor:pointer}
#scene:active{cursor:grabbing}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) 0 max(20px, env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:2px;color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;letter-spacing:.01em}
.brand p{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.92}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;background:var(--panel);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.pill-btn{border:0;background:var(--panel);box-shadow:var(--shadow);padding:9px 14px;border-radius:999px;font-size:12px;font-weight:600}

/* floor stack */
.floors{position:fixed;left:max(20px, env(safe-area-inset-left,0px));top:calc(96px + env(safe-area-inset-top,0px));z-index:4;
  display:flex;flex-direction:column;gap:3px;background:var(--panel);padding:8px;border-radius:14px;box-shadow:var(--shadow)}
.floors .cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;padding:2px 0 6px}
.fbtn{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:6px;border:0;background:transparent;border-radius:9px;padding:6px 8px 6px 6px;text-align:left;min-width:112px}
.fbtn .n{font-family:var(--f-mono);font-size:13px;font-weight:500;text-align:center}
.fbtn .m{font-size:11px;color:var(--muted);white-space:nowrap}
.fbtn .m b{font-weight:700;color:var(--avail)}
.fbtn:hover,.fbtn.hover{background:var(--soft)}
.fbtn[aria-current="true"]{background:var(--ink);color:var(--panel)}
.fbtn[aria-current="true"] .m,.fbtn[aria-current="true"] .m b{color:var(--panel);opacity:.85}
.fbtn.match .m b{color:var(--reserved)}

/* finder */
.finder{position:fixed;left:max(20px, env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;width:300px;
  background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.finder h2{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row label{font-size:12px;color:var(--muted);font-weight:600}
select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;font-size:12px}
.result{font-size:13px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.result strong{font-family:var(--f-display);font-size:24px;font-weight:400}
.linkish{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;padding:0}

/* sales panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;z-index:6;background:var(--panel);box-shadow:var(--shadow);
  display:flex;flex-direction:column;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(16px + env(safe-area-inset-top,0px)) max(22px, env(safe-area-inset-right,0px)) 10px 22px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:700}
.icon-btn{border:1px solid var(--line);background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.panel-body{overflow-y:auto;padding:18px max(22px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:18px}
.panel-body > *{flex-shrink:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0}
.ptitle{margin:0;font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.02;text-wrap:balance}
.ptitle em{font-style:italic;color:var(--accent)}
.lede{margin:0;color:var(--muted);line-height:1.55;max-width:60ch}
.price{font-family:var(--f-display);font-size:30px;line-height:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid currentColor}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-available{color:var(--avail)} .s-reserved{color:var(--reserved)} .s-sold{color:var(--sold)}
.plan{background:var(--plan-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plan svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.specs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.specs div{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.specs div:nth-child(odd){padding-right:12px}
.specs dt{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.specs dd{margin:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.units{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.units th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 0 8px}
.units td{padding:10px 0;border-top:1px solid var(--line)}
.units tr[data-unit]{cursor:pointer}
.units tr[data-unit]:hover td,.units tr.hl td{background:var(--soft)}
.units td:last-child,.units th:last-child{text-align:right}
.units .num{font-family:var(--f-mono);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;background:currentColor}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:13px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
form.book{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:12px;padding:16px}
form.book h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
form.book label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em}
form.book input,form.book select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;font-size:14px;font-weight:500;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.ok{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5}

/* 3D overlays */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.hot{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;border:0;background:rgba(14,18,18,.72);color:#fff;
  padding:6px 12px 6px 8px;border-radius:999px;font-size:12px;font-weight:600;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap;transform:translate(-50%,-50%)}
.hot::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.tip{position:fixed;left:0;top:0;z-index:7;pointer-events:none;background:var(--panel);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);
  padding:9px 12px;font-size:12px;line-height:1.4;max-width:240px;transform:translate(14px,14px)}
.tip b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block}
.hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;color:#fff;font-size:12px;font-weight:600;
  background:rgba(14,18,18,.55);padding:7px 14px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.viewbar{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:14px;
  background:rgba(14,18,18,.75);color:#fff;padding:8px 8px 8px 16px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.viewbar span{font-size:13px;font-weight:600;white-space:nowrap}
.viewbar button{border:0;background:#fff;color:#111;border-radius:999px;padding:8px 14px;font-weight:700;font-size:12px}
.loading{position:fixed;inset:0;z-index:20;background:var(--paper);display:grid;place-items:center;transition:opacity .8s}
.loading.done{opacity:0;pointer-events:none}
.loading p{font-family:var(--f-display);font-size:28px;margin:0}
.loading small{display:block;text-align:center;color:var(--muted);font-family:var(--f-body);font-size:12px;margin-top:6px}
.demo-tag{text-decoration:none;position:fixed;right:max(20px, env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:3;font-size:11px;color:#fff;opacity:.85;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.finder-toggle{display:none}
body.viewing .floors, body.viewing .finder, body.viewing .hint{display:none}

@media (max-width: 860px){
  .brand h1{font-size:26px}
  .brand p{font-size:10px}
  .floors{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px));transform:none;
    flex-direction:row;overflow-x:auto;padding:6px;gap:2px}
  .floors .cap{display:none}
  .fbtn{grid-template-columns:1fr;min-width:46px;padding:6px 4px;text-align:center;gap:1px}
  .fbtn .m{font-size:10px}
  .fbtn .m .word{display:none}
  .finder{bottom:calc(84px + env(safe-area-inset-bottom,0px));left:max(12px, env(safe-area-inset-left,0px));width:auto;right:max(12px, env(safe-area-inset-right,0px))}
  .finder[data-collapsed="true"] .fbody{display:none}
  .finder-toggle{display:inline-flex}
  .hint,.demo-tag{display:none}
  .panel{top:auto;height:72%;width:100%;border-radius:18px 18px 0 0;transform:translateY(105%)}
  .panel.open{transform:none}
  .panel-head{padding-top:14px}
  .ptitle{font-size:32px}
  .viewbar{width:calc(100% - 24px);justify-content:space-between}
  .viewbar span{white-space:normal}
}
@media (prefers-reduced-motion: reduce){ .panel{transition:none} .loading{transition:none} }

/* plan drawing */
.pl-wall{stroke:var(--plan-ink);fill:none;stroke-linejoin:miter}
.pl-fx{stroke:var(--plan-soft);fill:none;stroke-width:1.2}
.pl-fx .fill{fill:var(--plan-soft);fill-opacity:.18}
.pl-text{fill:var(--plan-ink);font-family:var(--f-body);font-weight:600}
.pl-dim{fill:var(--plan-soft);font-family:var(--f-mono)}
.pl-num{fill:var(--plan-ink);font-family:var(--f-display)}
.pl-halo{paint-order:stroke;stroke:var(--plan-bg);stroke-linejoin:round}
.pl-corr{fill:var(--plan-corr)}
.pl-win{fill:var(--plan-bg);stroke:var(--plan-ink);stroke-width:1}
.pl-bal{fill:none;stroke:var(--plan-ink);stroke-width:1.2;stroke-dasharray:6 5}
.pl-water{fill:#7cc3d6;fill-opacity:.45;stroke:var(--plan-ink);stroke-width:1.5}
.ufill{fill:transparent;transition:fill .2s}
.u.st-available .ufill{fill:color-mix(in srgb, var(--avail) 13%, transparent)}
.u.st-reserved .ufill{fill:color-mix(in srgb, var(--reserved) 13%, transparent)}
.u.st-sold .ufill{fill:color-mix(in srgb, var(--sold) 16%, transparent)}
.u{cursor:pointer}
.u:hover .ufill,.u.hl .ufill{fill:color-mix(in srgb, var(--accent) 22%, transparent)}
.u.dim{opacity:.38}
.u .usel{fill:none;stroke:transparent;stroke-width:7}
.u.sel .usel{stroke:var(--accent)}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="3D model of The Alder. Drag to orbit, scroll to zoom, click a floor to see its plan."></canvas>
<div id="labels"></div>

<header class="top">
  <div class="brand">
    <h1>The Alder</h1>
    <p>Residences · 10 storeys · Occupancy 2028</p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Time of day">
      <button type="button" data-time="day" aria-pressed="true">Day</button>
      <button type="button" data-time="sunset" aria-pressed="false">Sunset</button>
      <button type="button" data-time="night" aria-pressed="false">Night</button>
    </div>
    <button type="button" class="pill-btn" id="overview">Overview</button>
  </div>
</header>

<nav class="floors" id="floors" aria-label="Floors"></nav>

<section class="finder" id="finder" data-collapsed="true" aria-label="Find a home">
  <div class="row">
    <h2>Find a home</h2>
    <button type="button" class="linkish finder-toggle" id="finderToggle" aria-expanded="false">Filters</button>
  </div>
  <div class="fbody" style="display:flex;flex-direction:column;gap:12px">
    <div class="chips" role="group" aria-label="Bedrooms" id="bedChips">
      <button type="button" class="chip" data-beds="all" aria-pressed="true">Any</button>
      <button type="button" class="chip" data-beds="0" aria-pressed="false">Studio</button>
      <button type="button" class="chip" data-beds="1" aria-pressed="false">1 Bed</button>
      <button type="button" class="chip" data-beds="2" aria-pressed="false">2 Bed</button>
      <button type="button" class="chip" data-beds="3" aria-pressed="false">3+ Bed</button>
    </div>
    <div class="row">
      <label for="maxPrice">Max price</label>
      <select id="maxPrice">
        <option value="Infinity">Any price</option>
        <option value="600000">Under $600K</option>
        <option value="800000">Under $800K</option>
        <option value="1000000">Under $1M</option>
        <option value="1500000">Under $1.5M</option>
      </select>
    </div>
    <div class="row">
      <label for="minFloor">Floor</label>
      <select id="minFloor">
        <option value="2">Any floor</option>
        <option value="5">5th and up</option>
        <option value="8">8th and up</option>
      </select>
    </div>
  </div>
  <div class="result"><span><strong id="matchCount">0</strong> homes available</span><button type="button" class="linkish" id="clearFilters" hidden>Clear</button></div>
</section>

<aside class="panel" id="panel" aria-label="Details" aria-hidden="true">
  <div class="panel-head">
    <div class="crumbs" id="crumbs"></div>
    <button type="button" class="icon-btn" id="closePanel" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    </button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<div class="tip" id="tip" hidden></div>
<div class="hint" id="hint">Drag to orbit · Scroll to zoom · Click a floor or a window</div>
<div class="viewbar" id="viewbar" hidden><span id="viewText">View</span><button type="button" id="exitView">Back to building</button></div>
<a class="demo-tag" href="/">Demo · fictional development · Built by Rohan Kakkar</a>
<div class="loading" id="loading"><div><p>The Alder</p><small id="loadMsg">Preparing the building…</small></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* ================= DATA ================= */
const PW = 1000, PH = 560;            // plan units (1 unit = 0.1 ft)
const S = 0.0305;                     // metres per plan unit
const W = PW*S, D = PH*S;             // 30.5m x 17.08m plate
const GF_H = 5.0, FL_H = 3.15;
const floorBase = f => f===1 ? 0 : GF_H + (f-2)*FL_H;
const floorH = f => f===1 ? GF_H : FL_H;
const ROOF_Y = GF_H + 9*FL_H;         // 33.35
const ROOF_TOP = ROOF_Y + 0.45;
const mx = x => (x - PW/2)*S;
const mz = y => (y - PH/2)*S;
const NORTH_D = 255, CORR0 = 255, CORR1 = 305;

const fmt = new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0});
const fmtK = n => n>=1e6 ? '$'+(n/1e6).toFixed(2).replace(/0$/,'')+'M' : '$'+Math.round(n/1000)+'K';

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R = rng(20261102);

// Room templates. u: 0..1 across unit width (west→east). v: 0 = exterior wall → 1 = corridor wall.
const TPL = {
  ST:[['Living / Sleeping',0,0,1,.6,'studio'],['Kitchen',0,.6,.52,1,'kitchen'],['Bath',.52,.6,1,1,'bath']],
  '1B':[['Living',0,0,.56,.62,'living'],['Bedroom',.56,0,1,.62,'bed'],['Kitchen',0,.62,.38,1,'kitchen'],['Foyer',.38,.62,.6,1,'foyer'],['Bath',.6,.62,1,1,'bath']],
  '2B':[['Bedroom 2',0,0,.3,.6,'bed'],['Living',.3,0,.68,.6,'living'],['Primary',.68,0,1,.6,'bed'],['Bath',0,.6,.2,1,'bath'],['Kitchen',.2,.6,.48,1,'kitchen'],['Foyer',.48,.6,.64,1,'foyer'],['Ensuite',.64,.6,.84,1,'ensuite'],['W.I.C.',.84,.6,1,1,'closet']],
  '3B':[['Bedroom 3',0,0,.2,.6,'bed'],['Bedroom 2',.2,0,.4,.6,'bed'],['Living / Dining',.4,0,.72,.6,'living'],['Primary',.72,0,1,.6,'bed'],['Bath',0,.6,.18,1,'bath'],['Laundry',.18,.6,.3,1,'laundry'],['Kitchen',.3,.6,.56,1,'kitchen'],['Foyer',.56,.6,.7,1,'foyer'],['Ensuite',.7,.6,.88,1,'ensuite'],['W.I.C.',.88,.6,1,1,'closet']],
  // Penthouses span the full depth. v here = 0 north face → 1 south face.
  PHW:[['Bedroom 2',0,0,.55,.42,'bed'],['Bath',.55,0,.8,.24,'bath'],['Laundry',.8,0,1,.24,'laundry'],['Den',.55,.24,1,.42,'den'],['Kitchen',0,.42,.55,.58,'kitchenI'],['Foyer',.55,.42,1,.58,'foyer'],['Living / Dining',0,.58,.58,1,'living'],['Ensuite',.58,.58,1,.72,'ensuite'],['Primary',.58,.72,1,1,'bed']],
  PHE:[['Bedroom 3',0,0,.2,.42,'bed'],['Bedroom 2',.2,0,.4,.42,'bed'],['Bath',.4,0,.55,.22,'bath'],['Laundry',.4,.22,.55,.42,'laundry'],['Ensuite',.55,0,.72,.24,'ensuite'],['W.I.C.',.55,.24,.72,.42,'closet'],['Primary',.72,0,1,.42,'bed'],['Foyer',0,.42,.3,.58,'foyer'],['Kitchen',.3,.42,1,.58,'kitchenI'],['Living',0,.58,.6,1,'living'],['Dining',.6,.58,1,1,'dining']],
};

function layoutFor(f){
  if(f===9) return [
    {k:'01',x0:0,x1:360,side:'N',tpl:'2B'},{k:'02',x0:480,x1:1000,side:'N',tpl:'3B'},
    {k:'03',x0:0,x1:500,side:'S',tpl:'3B'},{k:'04',x0:500,x1:1000,side:'S',tpl:'3B'}];
  if(f===10) return [
    {k:'PH1',x0:0,x1:360,side:'NS',tpl:'PHW'},{k:'PH2',x0:480,x1:1000,side:'NS',tpl:'PHE'}];
  return [
    {k:'01',x0:0,x1:360,side:'N',tpl:'2B'},{k:'02',x0:480,x1:700,side:'N',tpl:'ST'},{k:'03',x0:700,x1:1000,side:'N',tpl:'1B'},
    {k:'04',x0:0,x1:380,side:'S',tpl:'2B'},{k:'05',x0:380,x1:640,side:'S',tpl:'1B'},{k:'06',x0:640,x1:1000,side:'S',tpl:'2B'}];
}

function roomsFor(u){
  const uw = u.x1-u.x0, out=[];
  for(const [name,a,b,c,d,kind] of TPL[u.tpl]){
    const x = u.x0 + a*uw, w = (c-a)*uw;
    let y,h,ext=null,orient;
    if(u.side==='NS'){ y=b*PH; h=(d-b)*PH; ext = b===0?'N':(d===1?'S':null); orient = (b+d)/2 < .5 ? 'N':'S'; }
    else if(u.side==='N'){ y=b*NORTH_D; h=(d-b)*NORTH_D; ext = b===0?'N':null; orient='N'; }
    else { y=PH-d*(PH-CORR1); h=(d-b)*(PH-CORR1); ext = b===0?'S':null; orient='S'; }
    out.push({name,kind,x,y,w,h,ext,orient});
  }
  return out;
}

const UNITS = [];
const FLOORS = {};
for(let f=2; f<=10; f++){
  FLOORS[f] = [];
  layoutFor(f).forEach((L,i)=>{
    const u = {...L, floor:f, id: f===10 ? L.k : `${f}${L.k}`};
    u.y0 = u.side==='S' ? CORR1 : 0;
    u.y1 = u.side==='N' ? NORTH_D : PH;
    u.rooms = roomsFor(u);
    u.beds = u.rooms.filter(r=>r.kind==='bed').length;
    u.baths = u.rooms.filter(r=>r.kind==='bath'||r.kind==='ensuite').length;
    u.den = u.rooms.some(r=>r.kind==='den');
    u.sqft = Math.round((u.x1-u.x0)*(u.y1-u.y0)*0.01/5)*5 - (u.side==='NS' ? 120 : 0);
    const living = u.rooms.find(r=>r.name.startsWith('Living'));
    u.living = living;
    u.balcony = u.side.includes('S') ? Math.round(living.w*0.1*(u.side==='NS'?7.9:5.9)) : 0;
    u.corner = u.x0===0 || u.x1===PW;
    u.penthouse = u.side==='NS';
    const psf = 690 + (f-2)*16;
    u.price = Math.round((u.sqft*psf + (u.corner?25000:0) + (u.penthouse?450000:0))/1000)*1000;
    u.fees = Math.round(u.sqft*0.58);
    const r = R();
    u.status = f===10 ? (u.k==='PH1'?'available':'reserved') : (r<.54?'available':r<.72?'reserved':'sold');
    u.exposure = {N:'North',S:'South',NS:'North & South'}[u.side] + (u.x0===0?' + West':u.x1===PW?' + East':'');
    u.type = (u.beds===0 ? 'Studio' : `${u.beds} Bedroom${u.den?' + Den':''}`);
    u.typeShort = u.beds===0 ? 'Studio' : `${u.beds} Bed${u.den?' + Den':''}`;
    u.label = u.penthouse ? `Penthouse ${u.k.slice(2)}` : `Suite ${u.id}`;
    UNITS.push(u); FLOORS[f].push(u);
  });
}
const byId = Object.fromEntries(UNITS.map(u=>[u.id,u]));

/* ================= PLAN DRAWING (SVG) ================= */
const n1 = v => Math.round(v*10)/10;
function ftin(units){ const ft = units*0.1; let F=Math.floor(ft), I=Math.round((ft-F)*12); if(I===12){F++;I=0;} return `${F}′${I}″`; }
function rect(x,y,w,h,extra=''){ return `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" ${extra}/>`; }
function line(x1,y1,x2,y2,extra=''){ return `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" ${extra}/>`; }

function furniture(r){
  const {x,y,w,h,kind,orient} = r, s=[];
  const top = orient!=='S';                     // window at top of room
  const back = top ? y+h : y;                    // wall opposite the window
  const at = (off,H) => top ? back-off-H : back+off;
  const cx = x+w/2, cy = y+h/2;
  switch(kind){
    case 'bed': case 'studio': {
      const bx = kind==='studio' ? x+w*0.72 : cx;
      const bw = Math.min(54, w-34), bl = Math.min(68, h-30);
      if(bw<30||bl<44) break;
      const by = at(4,bl);
      s.push(rect(bx-bw/2,by,bw,bl,'rx="3"'));
      const py = top ? by+bl-16 : by+4;
      s.push(rect(bx-bw/2+4,py,bw/2-6,12,'rx="3"'), rect(bx+2,py,bw/2-6,12,'rx="3"'));
      const fy = top ? by+bl*0.42 : by+bl*0.58;
      s.push(line(bx-bw/2,fy,bx+bw/2,fy));
      if(w > bw+46 && kind==='bed'){ const ny=at(4,15); s.push(rect(bx-bw/2-19,ny,15,15),rect(bx+bw/2+4,ny,15,15)); }
      if(kind==='studio'){ const sx=x+w*0.08, sw=Math.min(76,w*0.4); s.push(rect(sx,at(18,30),sw,30,'rx="5"'), rect(sx+sw*0.2, top? at(18,30)-44 : at(18,30)+30+18, sw*0.6,24,'rx="3"')); }
      break; }
    case 'living': {
      const sw = Math.min(84, w-40), sy = at(16,30);
      if(sw<40) break;
      s.push(rect(cx-sw/2,sy,sw,30,'rx="5"'), line(cx-sw/2+6, top?sy+8:sy+22, cx+sw/2-6, top?sy+8:sy+22));
      const rugH = Math.min(78, h-90), rugW = Math.min(118, w-34);
      const ry = top ? sy-12-rugH : sy+30+12;
      if(rugH>30){ s.push(rect(cx-rugW/2, ry, rugW, rugH, 'stroke-dasharray="3 3"')); s.push(rect(cx-22, ry+rugH/2-11, 44, 22, 'rx="2"')); }
      if(w>150){ const ax = cx+sw/2+10; s.push(rect(ax, ry+6, 28, 28, 'rx="5"')); }
      break; }
    case 'dining': {
      const tw = Math.min(72, w-56), th = Math.min(36, h-60);
      if(tw<30) break;
      s.push(rect(cx-tw/2, cy-th/2, tw, th, 'rx="2"'));
      for(let i=0;i<3;i++){ const ch = cx-tw/2+tw*(i+.5)/3-7; s.push(rect(ch,cy-th/2-15,14,11,'rx="2"'), rect(ch,cy+th/2+4,14,11,'rx="2"')); }
      break; }
    case 'kitchen': case 'kitchenI': {
      const cy0 = kind==='kitchenI' ? y+4 : at(2,22);
      s.push(rect(x+4, cy0, w-8, 22));
      const fx = x+4; s.push(rect(fx, cy0, 28, 22, 'class="fill"'));
      s.push(rect(cx-11, cy0+4, 22, 14, 'rx="3"'));
      const hx = x+w-26; [[0,0],[10,0],[0,9],[10,9]].forEach(([a,b])=>s.push(`<circle cx="${n1(hx+a)}" cy="${n1(cy0+6+b)}" r="3.4"/>`));
      if(w>150 && h>90){ const iw = Math.min(80,w*0.45); const iy = kind==='kitchenI' ? cy0+22+28 : (top? cy0-30-26 : cy0+22+26); s.push(rect(cx-iw/2, iy, iw, 26, 'rx="2"')); }
      break; }
    case 'bath': case 'ensuite': {
      if(kind==='bath' && w>=50){ const tw = Math.min(54, w-8); s.push(rect(x+4, at(4,26), tw, 26, 'rx="3"'), rect(x+8, at(8,18), tw-8, 18, 'rx="7"')); }
      else { const sw = Math.min(34, w-8, h-30); s.push(rect(x+4, at(4,sw), sw, sw), line(x+4, at(4,sw), x+4+sw, at(4,sw)+sw), line(x+4+sw, at(4,sw), x+4, at(4,sw)+sw)); }
      const ty = top ? y+5 : y+h-25;
      if(w>40){ s.push(rect(x+w-20, ty, 15, 7), `<ellipse cx="${n1(x+w-12.5)}" cy="${n1(top?ty+16:ty-2)}" rx="6.5" ry="8.5"/>`); }
      const vw = Math.min(30, w-34); if(vw>14){ const vy = top? y+4 : y+h-20; s.push(rect(x+6, vy, vw, 16), `<ellipse cx="${n1(x+6+vw/2)}" cy="${n1(vy+8)}" rx="7" ry="5"/>`); }
      break; }
    case 'closet': {
      const vert = h>w; const n = Math.floor((vert?h:w)/9);
      if(vert){ s.push(line(x+12,y+6,x+12,y+h-6), line(x+w-12,y+6,x+w-12,y+h-6)); for(let i=1;i<n;i++){ s.push(line(x+6,y+i*9,x+18,y+i*9), line(x+w-18,y+i*9,x+w-6,y+i*9)); } }
      else { s.push(line(x+6,y+12,x+w-6,y+12)); for(let i=1;i<n;i++) s.push(line(x+i*9,y+6,x+i*9,y+18)); }
      break; }
    case 'laundry': {
      const sz = Math.min(24,(w-12)/2); const ly = at(4,sz);
      s.push(rect(x+4,ly,sz,sz), `<circle cx="${n1(x+4+sz/2)}" cy="${n1(ly+sz/2)}" r="${n1(sz*0.33)}"/>`, rect(x+8+sz,ly,sz,sz), `<circle cx="${n1(x+8+sz*1.5)}" cy="${n1(ly+sz/2)}" r="${n1(sz*0.33)}"/>`);
      break; }
    case 'den': { s.push(rect(x+6, y+6, Math.min(56,w-12), 20), `<circle cx="${n1(x+30)}" cy="${n1(y+38)}" r="8"/>`); break; }
    case 'gym': {
      for(let i=0;i<5;i++){ const tx = x+20+i*Math.min(64,(w-40)/5); s.push(rect(tx, y+h-86, 26, 66, 'rx="4"'), rect(tx+3, y+h-26, 20, 5)); }
      for(let i=0;i<4;i++){ s.push(rect(x+24+i*72, y+40, 50, 22, 'rx="3"')); }
      s.push(rect(x+w-46, y+110, 26, 170, 'class="fill"'));
      for(let i=0;i<6;i++) s.push(`<circle cx="${n1(x+w-33)}" cy="${n1(y+124+i*26)}" r="6"/>`);
      s.push(rect(x+40, y+170, 150, 110, 'stroke-dasharray="4 4"'));
      break; }
    case 'lobby': {
      s.push(rect(x+w-190, y+70, 120, 34, 'rx="4" class="fill"'));
      s.push(rect(x+60, y+130, 90, 30, 'rx="6"'), rect(x+60, y+60, 90, 30, 'rx="6"'), `<circle cx="${n1(x+105)}" cy="${n1(y+110)}" r="14"/>`);
      s.push(`<circle cx="${n1(x+30)}" cy="${n1(y+30)}" r="12"/>`, `<circle cx="${n1(x+w-30)}" cy="${n1(y+h-30)}" r="12"/>`);
      break; }
    case 'lounge': {
      s.push(rect(x+30, y+40, 100, 30, 'rx="6"'), rect(x+30, y+110, 30, 80, 'rx="6"'), rect(x+80, y+100, 50, 50, 'rx="25"'), rect(x+w-80, y+40, 50, 120, 'rx="3"'));
      break; }
    case 'office': { s.push(rect(x+30, y+40, 110, 34, 'rx="3"'), `<circle cx="${n1(x+60)}" cy="${n1(y+95)}" r="10"/>`, `<circle cx="${n1(x+110)}" cy="${n1(y+95)}" r="10"/>`, rect(x+w-100, y+40, 70, 70, 'rx="35"')); break; }
    case 'mail': { for(let i=0;i<Math.floor((h-20)/14);i++) s.push(rect(x+8, y+10+i*14, 22, 12)); s.push(rect(x+w-40, y+20, 30, h-40, 'class="fill"')); break; }
    case 'deck': {
      for(let i=0;i<6;i++){ const lx = x+40+i*52; s.push(rect(lx, y+20, 24, 62, 'rx="4"'), rect(lx+2, y+20, 20, 18, 'rx="3"')); }
      break; }
    case 'pergola': { for(let i=0;i<Math.floor(w/14);i++) s.push(line(x+i*14+7, y+4, x+i*14+7, y+h-4)); s.push(rect(x+30, y+60, 120, 30, 'rx="6" class="fill"'), rect(x+30, y+90, 30, 70, 'rx="6" class="fill"'), `<circle cx="${n1(x+150)}" cy="${n1(y+140)}" r="18"/>`); break; }
  }
  return s.join('');
}

function windowsFor(rooms){
  const s=[];
  for(const r of rooms){
    if(!r.ext) continue;
    const wy = r.ext==='N' ? 0 : PH, ww = r.w*0.68, wx = r.x + (r.w-ww)/2;
    s.push(rect(wx, wy-4, ww, 8, 'class="pl-win"'), line(wx, wy, wx+ww, wy, 'stroke="var(--plan-ink)" stroke-width="0.8"'));
  }
  return s.join('');
}

function entryDoor(u){
  if(u.penthouse){
    const fo = u.rooms.find(r=>r.kind==='foyer'); const dy = fo.y + fo.h/2 - 15;
    const wx = u.x0===0 ? u.x1 : u.x0, dir = u.x0===0 ? -1 : 1;
    return rect(wx-3, dy, 6, 30, 'fill="var(--plan-bg)" stroke="none"') + line(wx, dy, wx+dir*30, dy, 'stroke="var(--plan-ink)" stroke-width="1.2"') +
      `<path d="M${n1(wx+dir*30)} ${n1(dy)} A30 30 0 0 ${dir>0?1:0} ${n1(wx)} ${n1(dy+30)}" fill="none" stroke="var(--plan-soft)" stroke-width="1"/>`;
  }
  const fo = u.rooms.find(r=>r.kind==='foyer') || u.rooms.find(r=>r.kind==='kitchen');
  const wy = u.side==='N' ? NORTH_D : CORR1, dx = fo.x + fo.w/2 - 15, dir = u.side==='N' ? -1 : 1;
  return rect(dx, wy-3, 30, 6, 'fill="var(--plan-bg)" stroke="none"') + line(dx, wy, dx, wy+dir*30, 'stroke="var(--plan-ink)" stroke-width="1.2"') +
    `<path d="M${n1(dx)} ${n1(wy+dir*30)} A30 30 0 0 ${dir>0?0:1} ${n1(dx+30)} ${n1(wy)}" fill="none" stroke="var(--plan-soft)" stroke-width="1"/>`;
}

function coreSVG(f){
  const s=[];
  s.push(rect(360,0,120,NORTH_D,'fill="var(--plan-corr)" class="pl-wall" stroke-width="3"'));
  s.push(rect(368,14,48,226,'class="pl-wall" stroke-width="1.5"'));
  for(let i=0;i<17;i++) s.push(line(368, 24+i*12.5, 392, 24+i*12.5, 'stroke="var(--plan-soft)" stroke-width="1"'), line(392, 24+i*12.5, 416, 24+i*12.5, 'stroke="var(--plan-soft)" stroke-width="1"'));
  s.push(line(392,24,392,236,'stroke="var(--plan-ink)" stroke-width="1.5"'));
  [[424,24],[424,96]].forEach(([ex,ey])=>{ s.push(rect(ex,ey,48,62,'class="pl-wall" stroke-width="1.5"'), line(ex,ey,ex+48,ey+62,'stroke="var(--plan-soft)"'), line(ex+48,ey,ex,ey+62,'stroke="var(--plan-soft)"')); });
  s.push(rect(424,172,48,64,'class="pl-wall" stroke-width="1"'));
  return s.join('');
}

function compass(vbx, vby, k){
  const s=[]; const cx = vbx, cy = vby;
  s.push(`<g transform="translate(${n1(cx)} ${n1(cy)})"><circle r="${n1(14*k)}" fill="none" stroke="var(--plan-soft)" stroke-width="${n1(k)}"/><path d="M0 ${n1(-12*k)} L${n1(5*k)} ${n1(6*k)} L0 ${n1(2*k)} L${n1(-5*k)} ${n1(6*k)} Z" fill="var(--plan-ink)"/><text y="${n1(-18*k)}" text-anchor="middle" class="pl-text" font-size="${n1(10*k)}">N</text></g>`);
  return s.join('');
}
function scalebar(x,y,k){
  const s=[`<g class="pl-dim" font-size="${n1(9*k)}">`];
  s.push(rect(x,y,100,4*k,'fill="var(--plan-ink)"'), rect(x+100,y,100,4*k,'fill="none" stroke="var(--plan-ink)" stroke-width="1"'));
  s.push(`<text x="${x}" y="${n1(y-5*k)}">0</text><text x="${x+100}" y="${n1(y-5*k)}" text-anchor="middle">10</text><text x="${x+200}" y="${n1(y-5*k)}" text-anchor="middle">20 ft</text></g>`);
  return s.join('');
}

function floorPlanSVG(f, focus=null){
  const units = FLOORS[f];
  let vb = focus ? [focus.x0-40, (focus.side==='S'||focus.penthouse) ? focus.y0-40 : -44, (focus.x1-focus.x0)+80, (focus.y1-focus.y0)+ (focus.side.includes('S')?118:88)] : [-36,-74,1072,720];
  if(focus && focus.side==='N') vb[1] = -44;
  const k = vb[2]/400; // svg units per css px at ~400px wide
  const s=[`<svg viewBox="${vb.map(n1).join(' ')}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Floor ${f} plan">`];
  // corridor
  if(f===10) s.push(rect(360,CORR0,120,PH-CORR0,'class="pl-corr"'));
  else s.push(rect(0,CORR0,PW,CORR1-CORR0,'class="pl-corr"'));
  // balconies
  for(const u of units){ if(!u.side.includes('S')) continue; const L=u.living, d = u.penthouse?79:59; s.push(rect(L.x+6, PH, L.w-12, d, 'class="pl-bal"')); if(focus===u) s.push(`<text x="${n1(L.x+L.w/2)}" y="${n1(PH+d/2+4*k)}" text-anchor="middle" class="pl-dim" font-size="${n1(10*k)}">${u.penthouse?'TERRACE':'BALCONY'} ${u.balcony} SQ FT</text>`); }
  for(const u of units){
    const cls = ['u', 'st-'+u.status];
    if(focus && focus!==u) cls.push('dim');
    if(state.unit===u) cls.push('sel');
    if(filterActive() && !matches(u)) cls.push('dim');
    s.push(`<g class="${cls.join(' ')}" data-unit="${u.id}">`);
    s.push(rect(u.x0,u.y0,u.x1-u.x0,u.y1-u.y0,'class="ufill"'));
    if(u.penthouse) s.push(rect(360,0,120,NORTH_D,'fill="var(--plan-bg)"'));
    s.push(`<g class="pl-fx">${u.rooms.map(furniture).join('')}</g>`);
    s.push(u.rooms.map(r=>rect(r.x,r.y,r.w,r.h,'class="pl-wall" stroke-width="2.2"')).join(''));
    s.push(rect(u.x0,u.y0,u.x1-u.x0,u.y1-u.y0,'class="pl-wall" stroke-width="4"'));
    s.push(entryDoor(u));
    if(focus===u){
      for(const r of u.rooms){ if(r.w<45||r.h<40) continue; const fs = Math.min(12*k, r.w/7);
        s.push(`<text x="${n1(r.x+r.w/2)}" y="${n1(r.y+r.h/2)}" text-anchor="middle" class="pl-text pl-halo" stroke-width="${n1(4*k)}" font-size="${n1(fs)}">${r.name}</text>`);

  s.push(rect(0,0,PW,PH,'class="pl-wall" stroke-width="8"'));

function canvasTex(w,h,draw,{srgb=true,rep=[1,1]}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]); t.anisotropy=maxAniso; return t;
}
function speckle(g,w,h,count,amp,size=2){
  for(let i=0;i<count;i++){ const v=Math.random()*2-1; g.fillStyle = v>0?`rgba(255,255,255,${v*amp})`:`rgba(0,0,0,${-v*amp})`; const s=Math.random()*size+.5; g.fillRect(Math.random()*w,Math.random()*h,s,s); }
}
function blotch(g,w,h,count,amp,r0,r1){
  for(let i=0;i<count;i++){ const x=Math.random()*w,y=Math.random()*h,r=r0+Math.random()*(r1-r0); const dark=Math.random()<.55;
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0, dark?`rgba(0,0,0,${amp})`:`rgba(255,255,255,${amp})`); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2);
    // wrap for tiling
    for(const [ox,oy] of [[w,0],[-w,0],[0,h],[0,-h]]){ const gr2=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r); gr2.addColorStop(0, dark?`rgba(0,0,0,${amp})`:`rgba(255,255,255,${amp})`); gr2.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr2; g.fillRect(x+ox-r,y+oy-r,r*2,r*2); }
  }
}

T.waterN = (()=>{ const N=256, c=document.createElement('canvas'); c.width=c.height=N; const g=c.getContext('2d'); const img=g.createImageData(N,N); const waves=[];
  for(let i=0;i<16;i++) waves.push({kx:Math.round((Math.random()*2-1)*9), ky:Math.round((Math.random()*2-1)*9)||2, a:Math.random()*.5+.15, p:Math.random()*6.283});

function worldUV(geo){
  const p=geo.attributes.position, n=geo.attributes.normal, uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++){ const ax=Math.abs(n.getX(i)), ay=Math.abs(n.getY(i)), az=Math.abs(n.getZ(i)); let u,v;
    if(ax>=ay&&ax>=az){u=p.getZ(i);v=p.getY(i);} else if(ay>=az){u=p.getX(i);v=p.getZ(i);} else {u=p.getX(i);v=p.getY(i);} uv.setXY(i,u,v); }
  uv.needsUpdate=true; return geo;
}

function box(w,h,d,x,y,z,m,{cast=true,receive=true,parent=building}={}){

}

    else if(u && state.unit===u){ c=C_SEL; op=.62; }
    else if(u && state.hoverUnit===u){ c=C_HOV; op=.42; }

/* ================= CAMERA MOTION ================= */
let fly = null;
const sphA = new THREE.Spherical(), sphB = new THREE.Spherical(), tmpV = new THREE.Vector3();
function flyTo(pos, target, dur=1.5, onDone){
  const p0=camera.position.clone(), t0=controls.target.clone();
  sphA.setFromVector3(tmpV.subVectors(p0,t0)); sphB.setFromVector3(tmpV.subVectors(pos,target));
  let dθ = sphB.theta - sphA.theta; if(dθ>Math.PI) dθ-=2*Math.PI; if(dθ<-Math.PI) dθ+=2*Math.PI;
  fly = {t0, t1:target.clone(), r0:sphA.radius, r1:sphB.radius, ph0:sphA.phi, ph1:sphB.phi, th0:sphA.theta, dθ, s:performance.now(), d:reduceMotion?1:dur*1000, onDone};
  controls.enabled = false;
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function stepFly(now){
  if(!fly) return;
  const k = Math.min(1,(now-fly.s)/fly.d), e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
  controls.target.lerpVectors(fly.t0, fly.t1, e);
  const sp = new THREE.Spherical(THREE.MathUtils.lerp(fly.r0,fly.r1,e), THREE.MathUtils.lerp(fly.ph0,fly.ph1,e), fly.th0+fly.dθ*e);
  camera.position.copy(controls.target).add(tmpV.setFromSpherical(sp));
  camera.lookAt(controls.target);
  if(k>=1){ const cb=fly.onDone; fly=null; if(!state.view) controls.enabled=true; cb && cb(); }
}
function currentAzimuth(){ sphA.setFromVector3(tmpV.subVectors(camera.position, controls.target)); return sphA.theta; }
function frameFloor(f){
  const y = floorBase(f)+floorH(f)/2; let th = currentAzimuth();
  // keep a facade in view: snap toward the nearest of SE / SW / NE / NW diagonals
  const t = new THREE.Vector3(0, y, 0); const r = 78;
  const pos = new THREE.Vector3().setFromSpherical(new THREE.Spherical(r, THREE.MathUtils.degToRad(80), th)).add(t);
  flyTo(pos, t);
}

}

}

function openUnit(u){
  if(state.view) exitViewSilently();
  state.floor=u.floor; state.unit=u; state.amenity=null;
  crumbs.innerHTML = `<button type="button" data-act="home">Building</button><span>/</span><button type="button" data-act="floor" data-floor="${u.floor}">${floorName(u.floor)}</button><span>/</span><span>${u.penthouse?u.k:u.id}</span>`;
  const sold = u.status==='sold';
  body.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><p class="eyebrow">${u.penthouse?'Penthouse':'Floor '+u.floor} · ${u.exposure}</p><span class="status s-${u.status}">${statusLabel(u.status)}</span></div>
      <h2 class="ptitle">${u.label}</h2>
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span class="price">${sold?'Sold':fmt.format(u.price)}</span><span style="color:var(--muted);font-weight:600">${u.type} · ${u.baths} Bath</span></div>
    </div>
    <div class="plan" id="plan">${floorPlanSVG(u.floor, u)}</div>
    <dl class="specs" style="margin:0">
      <div><dt>Interior</dt><dd>${u.sqft.toLocaleString()} sq ft</dd></div>
      <div><dt>${u.penthouse?'Terrace':'Balcony'}</dt><dd>${u.balcony?u.balcony+' sq ft':'Juliet, north-facing'}</dd></div>
      <div><dt>Bedrooms</dt><dd>${u.beds===0?'Studio':u.beds}${u.den?' + den':''}</dd></div>
      <div><dt>Bathrooms</dt><dd>${u.baths}</dd></div>
      <div><dt>Exposure</dt><dd>${u.exposure}</dd></div>
      <div><dt>Ceiling height</dt><dd>${u.penthouse?'10′ 6″':'9′ 0″'}</dd></div>
      <div><dt>Est. condo fees</dt><dd>${fmt.format(u.fees)}/mo</dd></div>
      <div><dt>Parking</dt><dd>${u.beds>=2?'1 stall included':'Optional, $45,000'}</dd></div>
    </dl>
    <div class="actions">
      <button type="button" class="btn ghost" data-act="view">See the view from here</button>
      ${sold?'':`<a class="btn ghost" href="#book" data-act="book" style="text-decoration:none;color:inherit">Book a viewing</a>`}
    </div>
    ${sold ? `<p class="note">This home has sold. Similar ${u.typeShort.toLowerCase()} homes may be available on other floors.</p>` : `
    <form class="book" id="book" novalidate>
      <h3>Book a private viewing</h3>
      <div class="two">
        <label for="bkName">Name<input id="bkName" name="name" autocomplete="name" required></label>
        <label for="bkDate">Preferred day<select id="bkDate" name="day">${nextDays().map(d=>`<option>${d}</option>`).join('')}</select></label>
      </div>
      <label for="bkEmail">Email<input id="bkEmail" name="email" type="email" autocomplete="email" required></label>
      <button type="submit" class="btn primary">Request viewing for ${u.penthouse?u.k:'Suite '+u.id}</button>
      <p class="note">Presentation centre open Tuesday to Sunday, 11 a.m. to 6 p.m.</p>
      <div id="bkMsg" hidden></div>
    </form>`}`;
  openPanel(); refreshOverlays(); renderFloorNav(); frameUnit(u);
}
function nextDays(){ const out=[]; const d=new Date(); for(let i=1;out.length<6;i++){ const x=new Date(d); x.setDate(d.getDate()+i); if(x.getDay()===1) continue; out.push(x.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})); } return out; }

function openAmenity(kind){
  if(state.view) exitViewSilently();
  state.amenity=kind; state.floor = kind==='pool'?'R':1; state.unit=null;
  crumbs.innerHTML = `<button type="button" data-act="home">Building</button><span>/</span><span>${kind==='pool'?'Roof':'Ground floor'}</span>`;
  const pool = kind==='pool';
  body.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px">
      <p class="eyebrow">${pool?'Rooftop · Level 11':'Ground floor · Residents only'}</p>
      <h2 class="ptitle">${pool?'Rooftop <em>pool</em> &amp; terrace':'Fitness <em>centre</em> &amp; lobby'}</h2>
      <p class="lede">${pool
        ? 'A heated saltwater pool on the south side of the roof, with sun loungers, a covered cabana lounge with a fire table, and planted edges facing the skyline.'
        : 'A 2,000 sq ft fitness centre with floor-to-ceiling south glass, cardio row, free weights and a stretching zone. The double-height lobby has a 24-hour concierge and a parcel room.'}</p>
    </div>
    <div class="plan">${amenityPlanSVG(kind)}</div>
    <dl class="specs" style="margin:0">
      ${pool ? `
      <div><dt>Pool</dt><dd>46′ × 15′, saltwater</dd></div>
      <div><dt>Water temperature</dt><dd>28 °C, heated</dd></div>
      <div><dt>Season</dt><dd>May to October</dd></div>
      <div><dt>Hours</dt><dd>7 a.m. to 10 p.m.</dd></div>
      <div><dt>Cabana lounge</dt><dd>Seats 14, fire table</dd></div>
      <div><dt>Bookable</dt><dd>Yes, for private events</dd></div>` : `
      <div><dt>Fitness centre</dt><dd>2,010 sq ft</dd></div>
      <div><dt>Hours</dt><dd>Open 24 hours</dd></div>
      <div><dt>Equipment</dt><dd>5 treadmills, free weights</dd></div>
      <div><dt>Flooring</dt><dd>Rubber, sound-isolated</dd></div>
      <div><dt>Concierge</dt><dd>24 hours</dd></div>
      <div><dt>Parcel room</dt><dd>Refrigerated lockers</dd></div>`}
    </dl>`;
  openPanel(); refreshOverlays(); renderFloorNav(); frameAmenity(kind);
}

panel.addEventListener('click', e=>{
  const a = e.target.closest('[data-act]'); if(a){
    const act=a.dataset.act;
    if(act==='home'){ closePanel(); frameHome(); }
    else if(act==='floor') selectFloor(+a.dataset.floor);
    else if(act==='view') enterView(state.unit);
    else if(act==='book'){ e.preventDefault(); const f=document.getElementById('bkName'); f && f.scrollIntoView({behavior: reduceMotion?'auto':'smooth', block:'center'}); f && f.focus({preventScroll:true}); }
    return;
  }
  const u = e.target.closest('[data-unit]'); if(u) openUnit(byId[u.dataset.unit]);
});
panel.addEventListener('pointerover', e=>{ const el=e.target.closest('[data-unit]'); const u = el ? byId[el.dataset.unit] : null; if(state.hoverUnit!==u){ state.hoverUnit=u; refreshOverlays(); } });
panel.addEventListener('pointerleave', ()=>{ state.hoverUnit=null; refreshOverlays(); });
panel.addEventListener('submit', e=>{
  e.preventDefault(); const f=e.target; const name=f.name.value.trim(), email=f.email.value.trim(); const msg=document.getElementById('bkMsg');
  msg.hidden=false;
  if(!name || !/^\S+@\S+\.\S+$/.test(email)){ msg.className='note'; msg.textContent='Add your name and a valid email address so the sales team can confirm a time.'; return; }
  msg.className='ok'; msg.textContent=`Thanks, ${name}. Your request for ${f.day.value} is noted. This is a demo, so no message was sent.`;
});
document.getElementById('closePanel').addEventListener('click', ()=>{ closePanel(); });
document.getElementById('overview').addEventListener('click', ()=>{ if(state.view) exitViewSilently(); closePanel(); frameHome(); });
document.getElementById('exitView').addEventListener('click', exitView);
document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>applyTime(b.dataset.time)));
addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(state.view) exitView(); else if(panel.classList.contains('open')){ closePanel(); } } });

// finder
function updateFinder(){
  document.querySelectorAll('#bedChips .chip').forEach(c=>c.setAttribute('aria-pressed', String(c.dataset.beds===state.beds)));
  const n = UNITS.filter(matches).length;
  document.getElementById('matchCount').textContent = n;
  document.getElementById('clearFilters').hidden = !filterActive();
  refreshOverlays(); renderFloorNav();
  if(state.floor && typeof state.floor==='number' && state.floor>1 && !state.unit) renderFloorPanel(state.floor);
}
document.getElementById('bedChips').addEventListener('click', e=>{ const c=e.target.closest('[data-beds]'); if(!c) return; state.beds=c.dataset.beds; updateFinder(); });
document.getElementById('maxPrice').addEventListener('change', e=>{ state.max = Number(e.target.value); updateFinder(); });
document.getElementById('minFloor').addEventListener('change', e=>{ state.minFloor = Number(e.target.value); updateFinder(); });
document.getElementById('clearFilters').addEventListener('click', ()=>{ state.beds='all'; state.max=Infinity; state.minFloor=2; document.getElementById('maxPrice').value='Infinity'; document.getElementById('minFloor').value='2'; updateFinder(); });
const finder = document.getElementById('finder');
document.getElementById('finderToggle').addEventListener('click', e=>{ const c = finder.dataset.collapsed!=='true'; finder.dataset.collapsed=String(c); e.target.setAttribute('aria-expanded', String(!c)); });

/* hotspots */
const labels = document.getElementById('labels');
const hotEls = [
  {pos:new THREE.Vector3(-5, ROOF_TOP+1.4, 3.9), text:'Rooftop pool', act:()=>openAmenity('pool')},
  {pos:new THREE.Vector3(-9.5, 2.6, D/2+0.4), text:'Fitness centre', act:()=>openAmenity('gym')},
].map(h=>{ const b=document.createElement('button'); b.type='button'; b.className='hot'; b.textContent=h.text; b.addEventListener('click',h.act); labels.appendChild(b); return {...h, el:b}; });
const pv = new THREE.Vector3();
function placeLabels(){
  for(const h of hotEls){ if(h.el.hidden) continue; pv.copy(h.pos).project(camera);
    const vis = pv.z<1 && Math.abs(pv.x)<1.05 && Math.abs(pv.y)<1.05;
    h.el.style.visibility = vis?'visible':'hidden';
    const w = renderer.domElement.clientWidth, hh = renderer.domElement.clientHeight;
    h.el.style.transform = `translate(${(pv.x*.5+.5)*w}px, ${(-pv.y*.5+.5)*hh}px) translate(-50%,-50%)`; }
}

/* picking */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); const tip = document.getElementById('tip');
let pointer = null, downAt = null, dragLook = null;
function pick(){
  if(!pointer || state.view) return null;
  const r = canvas.getBoundingClientRect(); ndc.set((pointer.x-r.left)/r.width*2-1, -(pointer.y-r.top)/r.height*2+1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData : null;
}
function updateHover(){
  const h = fly ? null : pick();
  const f = h ? h.floor : null, u = h ? (h.unit||null) : null;
  if(f!==state.hoverFloor || u!==state.hoverUnit){ state.hoverFloor=f; state.hoverUnit=u; refreshOverlays(); renderFloorNav(); }
  canvas.classList.toggle('pointing', !!h);
  if(h && pointer){
    tip.hidden=false; tip.style.left=pointer.x+'px'; tip.style.top=pointer.y+'px';
    if(u) tip.innerHTML = `<b>${u.label}</b>${u.type} · ${u.sqft.toLocaleString()} sq ft<br><span class="s-${u.status}" style="font-weight:700">${statusLabel(u.status)}</span>${u.status!=='sold'?' · '+fmt.format(u.price):''}`;
    else if(f==='R') tip.innerHTML = `<b>Roof</b>Saltwater pool and cabana lounge`;
    else if(f===1) tip.innerHTML = `<b>Ground floor</b>Lobby, concierge and fitness centre`;
    else { const av=FLOORS[f].filter(x=>x.status==='available').length; tip.innerHTML = `<b>${floorName(f)}</b>${av} of ${FLOORS[f].length} homes available`; }
  } else tip.hidden=true;
}
canvas.addEventListener('pointermove', e=>{
  pointer = {x:e.clientX, y:e.clientY};
  if(state.view && dragLook){ look.yaw = THREE.MathUtils.clamp(look.yaw - (e.clientX-dragLook.x)*0.004, -1.2, 1.2); look.pitch = THREE.MathUtils.clamp(look.pitch + (e.clientY-dragLook.y)*0.003, -0.6, 0.45); dragLook={x:e.clientX,y:e.clientY}; }
});
canvas.addEventListener('pointerleave', ()=>{ pointer=null; tip.hidden=true; if(state.hoverFloor!=null||state.hoverUnit){ state.hoverFloor=null; state.hoverUnit=null; refreshOverlays(); renderFloorNav(); } });
canvas.addEventListener('pointerdown', e=>{ downAt = {x:e.clientX,y:e.clientY}; if(state.view) dragLook={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup', e=>{
  dragLook=null;
  if(!downAt || e.target!==canvas) { downAt=null; return; }
  const moved = Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y); downAt=null;
  if(moved>6 || state.view) return;
  pointer = {x:e.clientX, y:e.clientY};
  const h = pick(); if(!h) return;
  if(h.unit) openUnit(h.unit); else selectFloor(h.floor);
});

/* ================= LOOP ================= */
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); panelTarget = panel.classList.contains('open') && innerWidth>860 ? 440 : 0; }
addEventListener('resize', resize); resize();
let last = performance.now(), hoverTick = 0, first = true;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05,(now-last)/1000); last = now;
  stepFly(now);
  if(!fly && !state.view) controls.update();
  applyLook();
  // shift the view left while the panel is open on wide screens
  panelW += (panelTarget-panelW)*Math.min(1, dt*7);
  if(panelW>0.5){ camera.setViewOffset(innerWidth+panelW, innerHeight, panelW, 0, innerWidth, innerHeight); } else camera.clearViewOffset();
  T.waterN.offset.x += dt*0.018; T.waterN.offset.y += dt*0.011;
  if((hoverTick++ & 1)===0) updateHover();
  placeLabels();
  renderer.render(scene, camera);
  if(first){ first=false; requestAnimationFrame(()=>document.getElementById('loading').classList.add('done')); }
}
applyTime('day');
renderFloorNav(); updateFinder();
requestAnimationFrame(loop);
window.__alder = {renderer, sunLight, state, selectFloor, openUnit, openAmenity, applyTime, byId, camera, controls, enterView};
</script>

</body>
